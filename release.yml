notes: |
  发布日期：2026-10-25
  
  - 🎨 更新应用、托盘和文档站 Logo，并为六个内置工具换用低饱和扁平图标。
  - ✨️ 支持拖动侧栏边缘在 100–280 px 间调整宽度并自动保存。
  - 🎨 精简顶部栏和设置布局，主题按钮展示当前模式，优化回收站空状态与首页操作按钮。
  - ✨️ 帮助菜单新增关于与检查更新入口，可直接打开关于页并自动检查更新。
  - 🐛 Windows 正式构建禁用非编辑区原生右键菜单与刷新快捷键，保留输入区菜单和开发模式操作。
  
