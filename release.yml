release_date: 2026-10-26
prerelease: true
notes: |
  发布日期：2026-10-26
  
  - ✨️ 新增日历工具，支持月历、农历、节气、节日、调休标记和日期详情，配备独立日历图标。
  - ✨️ 扩展本机应用扫描，支持微软商店与打包应用、带参数快捷方式，完善图标、去重和启动检测。
  - ✨️ 添加启动项弹窗支持拖入应用、快捷方式、文件或文件夹，自动识别路径、名称和类型。
  - 🎨 优化倒数日筛选与网格/列表切换，默认展示全部，新建表单独立展示并统一文案。
  - 🎨 调整快捷面板间距与底部操作，搜索关键词加粗并跟随主题色，顶栏新增页面刷新，关于页更新日志链接指向站点。
  
  > 测试版，请先备份重要文档；遇到问题请通过 Issues 反馈。
